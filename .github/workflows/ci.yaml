name: CloudCart CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API image
        run: |
          docker build \
            -f backend/api/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-api:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-api:latest \
            .

      - name: Build Worker image
        run: |
          docker build \
            -f backend/worker/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-worker:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-worker:latest \
            .

      - name: Build Frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-frontend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-frontend:latest \
            ./frontend
      
     
      - name: Trivy Scan API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  
      - name: Trivy Scan Worker
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-worker:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      
      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH' 
     



      - name: Push API image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-api:latest

      - name: Push Worker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-worker:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-worker:latest

      - name: Push Frontend image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart-frontend:latest
